    .accent{stroke:#45e0cf;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
    .muscle{fill:#ff6c48;opacity:.92;filter:url(#glow)}
    .floor{stroke:#315259;stroke-width:2}
  </style>
</defs>
