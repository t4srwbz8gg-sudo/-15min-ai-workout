<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08161c"/><stop offset="1" stop-color="#0d252b"/></linearGradient>
  <linearGradient id="skin" x1="0" x2="1"><stop stop-color="#f0b48b"/><stop offset="1" stop-color="#c97c55"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
