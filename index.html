<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="15MIN AI">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>15MIN AI WORKOUT</title>
<style>
:root{--bg:#080d12;--panel:#101821;--panel2:#17232e;--line:#263746;--text:#f6f8fb;--muted:#95a5b4;--accent:#52f0b0;--accent2:#7cb7ff;--warn:#ffd56a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#15302a 0,#0c141b 34%,#080d12 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.screen{display:none;position:relative;min-height:calc(100vh - 60px)}.screen.active{display:block}.screen.visual::before,.screen.visual::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2}.screen.visual::before{background:radial-gradient(circle at 20% 20%,rgba(82,240,176,.18),transparent 28%),radial-gradient(circle at 80% 35%,rgba(90,130,255,.16),transparent 30%),linear-gradient(120deg,#071016,#0d171f 48%,#071016);animation:drift 10s ease-in-out infinite alternate}.screen.visual::after{z-index:-1;opacity:.32;background:repeating-linear-gradient(115deg,transparent 0 28px,rgba(82,240,176,.06) 29px 30px,transparent 31px 58px);animation:scan 7s linear infinite}.screen.visual.ai::before{background:radial-gradient(circle at 50% 18%,rgba(82,240,176,.25),transparent 24%),conic-gradient(from 180deg at 50% 55%,#071016,#0a1d22,#10152a,#071016);filter:saturate(1.25)}.screen.noVisual::before,.screen.noVisual::after{display:none}@keyframes drift{from{transform:scale(1) translate3d(-1%,0,0)}to{transform:scale(1.08) translate3d(2%,-1%,0)}}@keyframes scan{from{transform:translateX(-8%)}to{transform:translateX(8%)}}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--muted)}.title{font-size:31px;font-weight:950;line-height:1.02;margin:5px 0}.gear,.back{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#101821;color:var(--text);font-size:21px}.hero{margin-top:22px;padding:22px;border-radius:26px;background:linear-gradient(145deg,#13211f,#0e171f);border:1px solid #1d3a34;text-align:center}.logo{width:96px;height:96px;margin:0 auto 12px;display:block}.hero h2{margin:0;font-size:25px}.hero p{margin:8px auto 0;max-width:420px;color:var(--muted);line-height:1.6;font-size:14px}.start{width:100%;min-height:58px;border:0;border-radius:18px;background:var(--accent);color:#06110c;font-size:18px;font-weight:950;margin-top:18px}.recommend{margin-top:11px;color:var(--accent);font-size:13px;font-weight:800}.section{margin-top:22px}.section h3{font-size:16px;margin:0 0 10px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{min-height:56px;border-radius:15px;border:1px solid var(--line);background:#101821;color:var(--text);font-weight:900}.day.recommended{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.day.disabled{opacity:.42}.hint{font-size:12px;color:var(--muted);margin-top:9px}.card{background:rgba(16,24,33,.96);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.big{font-size:27px;font-weight:950}.muted{color:var(--muted)}.mini{font-size:12px}.exerciseBox{margin-top:14px;padding:18px;border-radius:20px;background:linear-gradient(145deg,#17252c,#101922);border:1px solid #284039}.exerciseName{font-size:25px;font-weight:950;margin-bottom:8px}.spec{font-size:16px;color:#dfe8ef}.progress{display:flex;gap:6px;margin-top:13px}.dot{height:7px;flex:1;border-radius:999px;background:#22313e}.dot.on{background:var(--accent)}.complete{width:100%;min-height:56px;margin-top:16px;border:0;border-radius:16px;background:var(--accent);color:#07120d;font-weight:950;font-size:17px}.complete:disabled{opacity:.45}.restBox{text-align:center}.restLabel{font-size:13px;color:var(--muted)}.restTime{font-size:58px;font-weight:950;font-variant-numeric:tabular-nums;margin:6px 0}.bar{height:8px;background:#1d2934;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:100%;background:var(--accent);transition:width .25s linear}.nextText{margin-top:12px;font-size:14px;color:var(--muted)}.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.toggle{width:50px;height:30px;appearance:none;background:#293846;border-radius:999px;position:relative;transition:.2s}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:white;border-radius:50%;transition:.2s}.toggle:checked{background:var(--accent)}.toggle:checked:after{left:23px}.range{width:150px}.finish{text-align:center;padding:24px 8px}.finish h2{font-size:28px;margin:8px 0}.finish p{color:var(--muted);line-height:1.6}.secondary{width:100%;min-height:50px;border-radius:15px;border:1px solid var(--line);background:#111b24;color:var(--text);font-weight:800;margin-top:10px}.statusPill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}@media(max-width:420px){.days{grid-template-columns:repeat(5,1fr)}.day{font-size:12px}.title{font-size:28px}.exerciseName{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
  <div class="top">
    <div><div class="eyebrow">15 MINUTES. JUST START.</div><div class="title">15MIN AI<br>WORKOUT</div></div>
    <button id="openSettings" class="gear" aria-label="設定">⚙︎</button>
  </div>
  <div class="hero">
    <img class="logo" src="./icon.svg" alt="15MIN AI WORKOUT">
    <h2>今日も15分だけ。</h2>
    <p>前回の続きからおすすめします。別のDAYを選んで始めることもできます。</p>
    <button id="quickStart" class="start">おすすめDAYをスタート</button>
    <div id="recommendText" class="recommend"></div>
  </div>
  <div class="section">
    <h3>DAYを選ぶ</h3>
    <div id="dayChoices" class="days"></div>
    <div class="hint">現在、内容が確定しているDAYのみ開始できます。</div>
  </div>
</section>

<section id="settings" class="screen">
  <div class="top"><button class="back" data-back="home">‹</button><div><div class="eyebrow">SETTINGS</div><div class="title" style="font-size:26px">設定</div></div><div style="width:46px"></div></div>
  <div class="card settings">
    <label><span><b>音声ガイド</b><br><span class="mini muted">種目・重量・回数・次のセットを読み上げ</span></span><input id="voiceToggle" class="toggle" type="checkbox"></label>
    <label><span><b>応援ボイス</b><br><span class="mini muted">「頑張りましょう」などの声かけ</span></span><input id="cheerToggle" class="toggle" type="checkbox"></label>
    <label><span><b>BGM</b><br><span class="mini muted">トレーニング中に再生</span></span><input id="bgmToggle" class="toggle" type="checkbox"></label>
    <label><span><b>BGM曲</b><br><span class="mini muted">アップロードした2曲から選択</span></span><select id="bgmTrack" style="background:#111b24;color:white;border:1px solid var(--line);border-radius:10px;padding:8px"><option value="142">RAGE 142 BPM</option><option value="118">FOCUS 118 BPM</option></select></label>
    <label><span><b>BGM音量</b></span><input id="volume" class="range" type="range" min="0" max="100" value="38"></label>
    <label><span><b>背景映像</b><br><span class="mini muted">トレ中・レスト中に動く背景</span></span><input id="visualToggle" class="toggle" type="checkbox"></label>
    <label><span><b>背景スタイル</b></span><select id="visualStyle" style="background:#111b24;color:white;border:1px solid var(--line);border-radius:10px;padding:8px"><option value="dark">DARK NEON</option><option value="ai">AI FUTURE</option></select></label>
  </div>
  <button class="secondary" data-back="home">タイトルへ戻る</button>
</section>

<section id="prepare" class="screen">
  <div class="top"><button class="back" data-back="home">‹</button><div><div class="eyebrow">READY</div><div id="prepareTitle" class="title" style="font-size:26px"></div></div><div class="statusPill">15分固定</div></div>
  <div id="prepareList"></div>
  <button id="beginWorkout" class="start">このDAYを開始</button>
</section>

<section id="workout" class="screen visual">
  <div class="top">
    <div><div class="eyebrow">WORKOUT</div><div id="workoutDay" class="title" style="font-size:24px"></div></div>
    <div class="statusPill"><span id="mainTime">15:00</span></div>
  </div>
  <div class="exerciseBox">
    <div class="mini muted">現在の種目</div>
    <div id="exerciseName" class="exerciseName"></div>
    <div id="exerciseSpec" class="spec"></div>
    <div id="setProgress" class="progress"></div>
    <button id="setComplete" class="complete">このセット完了</button>
  </div>
  <div class="card">
    <div class="row"><span class="muted mini">次</span><b id="upNext"></b></div>
  </div>
  <button id="quitWorkout" class="secondary">トレーニングを終了</button>
</section>

<section id="rest" class="screen visual">
  <div class="top"><div><div class="eyebrow">REST</div><div class="title" style="font-size:24px">しっかり休む</div></div><div class="statusPill"><span id="mainTimeRest">15:00</span></div></div>
  <div class="card restBox">
    <div class="restLabel">レスト</div>
    <div id="restTime" class="restTime">60</div>
    <div class="bar"><div id="restBar"></div></div>
    <div id="restNext" class="nextText"></div>
  </div>
  <button id="skipRest" class="secondary">レストをスキップ</button>
</section>

<section id="finish" class="screen">
  <div class="top"><button class="back" data-back="home">‹</button><div></div><div style="width:46px"></div></div>
  <div class="finish">
    <img class="logo" src="./icon.svg" alt="">
    <h2>今日の15分、完了。</h2>
    <p id="finishText"></p>
    <button id="finishHome" class="start">タイトルへ</button>
  </div>
</section>
</div>
<audio id="bgmAudio" loop playsinline preload="metadata"></audio>
<script>
const W=[4,5.5,7,8.5,10,11.5,13,14.5,16,17.5,19,20.5,22,23.5,25,26.5,28,29.5,31,32.5,34,35.5,37,38.5,40,41.5];
const BASE={
1:{t:'DAY1',s:'メニュー未設定',e:[]},
2:{t:'DAY2｜背中＋二頭',s:'背中と腕を鍛える日',e:[
{id:'row',n:'ワンハンドロー',w:10,r:'左右12回',sets:3,voice:'左右12回'},
{id:'rf',n:'リバースフライ',w:4,r:'15回',sets:3,voice:'15回'},
{id:'curl',n:'ダンベルカール',w:7,r:'12回',sets:3,voice:'12回'}]},
3:{t:'DAY3｜脚',s:'下半身を鍛える日',e:[
{id:'sq',n:'ダンベルスクワット',w:10,r:'12回',sets:3,two:true,voice:'12回'},
{id:'bg',n:'ブルガリアンスクワット',w:8.5,r:'左右10回',sets:3,two:true,voice:'左右10回'},
{id:'rdl',n:'ルーマニアンデッドリフト',w:10,r:'12回',sets:2,two:true,voice:'12回'}]},
4:{t:'DAY4',s:'メニュー未設定',e:[]},
5:{t:'DAY5',s:'メニュー未設定',e:[]}
};
const state={
plan:JSON.parse(localStorage.getItem('plan')||'null')||JSON.parse(JSON.stringify(BASE)),
lastDay:+(localStorage.getItem('lastCompletedDay')||0),
selectedDay:2,exerciseIndex:0,setIndex:1,
mainSec:900,mainTimer:null,restTimer:null,restSec:60,
ctx:null,master:null,bgmTimer:null,bgmStep:0,
settings:{
voice:localStorage.getItem('voiceOn')!=='off',
cheer:localStorage.getItem('cheerOn')!=='off',
bgm:localStorage.getItem('bgmOn')!=='off',
volume:+(localStorage.getItem('bgmVolume')||38),
track:localStorage.getItem('bgmTrack')||'142',
visual:localStorage.getItem('visualOn')!=='off',
visualStyle:localStorage.getItem('visualStyle')||'dark'
}
};
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
function applyVisuals(){['workout','rest'].forEach(id=>{const el=q('#'+id);el.classList.toggle('noVisual',!state.settings.visual);el.classList.toggle('ai',state.settings.visualStyle==='ai')})}function show(id){applyVisuals();qa('.screen').forEach(x=>x.classList.toggle('active',x.id===id));}
function saveSettings(){localStorage.setItem('voiceOn',state.settings.voice?'on':'off');localStorage.setItem('cheerOn',state.settings.cheer?'on':'off');localStorage.setItem('bgmOn',state.settings.bgm?'on':'off');localStorage.setItem('bgmVolume',state.settings.volume);localStorage.setItem('bgmTrack',state.settings.track);localStorage.setItem('visualOn',state.settings.visual?'on':'off');localStorage.setItem('visualStyle',state.settings.visualStyle);}
function configuredDays(){return [1,2,3,4,5].filter(d=>state.plan[d].e.length)}
function recommendedDay(){
 const all=[1,2,3,4,5], start=state.lastDay?state.lastDay%5+1:configuredDays()[0]||1;
 for(let i=0;i<5;i++){const d=((start-1+i)%5)+1;if(state.plan[d].e.length)return d}
 return 1;
}
function renderHome(){
 const rec=recommendedDay(); state.selectedDay=rec;
 q('#recommendText').textContent=state.plan[rec].e.length?'おすすめ：'+state.plan[rec].t:'メニュー設定待ち';
 q('#quickStart').disabled=!state.plan[rec].e.length;
 q('#dayChoices').innerHTML=[1,2,3,4,5].map(d=>'<button class="day '+(d===rec?'recommended ':'')+(!state.plan[d].e.length?'disabled':'')+'" data-day="'+d+'">DAY'+d+'</button>').join('');
 qa('.day').forEach(b=>b.addEventListener('click',()=>{const d=+b.dataset.day;if(!state.plan[d].e.length){alert('DAY'+d+'はまだメニュー未設定です。');return}openPrepare(d)}));
}
function openPrepare(day){
 state.selectedDay=day; const d=state.plan[day];
 q('#prepareTitle').textContent=d.t;
 q('#prepareList').innerHTML=d.e.map((e,i)=>'<div class="card"><div class="row"><div><b>'+(i+1)+'. '+e.n+'</b><div class="mini muted" style="margin-top:5px">'+e.w+'kg'+(e.two?' × 2':'')+' ／ '+e.r+' ／ '+e.sets+'セット</div></div><span class="statusPill">'+e.sets+' SET</span></div></div>').join('');
 show('prepare');
}
function speak(text){
 if(!state.settings.voice||!('speechSynthesis'in window))return;
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.98;u.pitch=1; speechSynthesis.speak(u);
}
function cheer(){
 if(!state.settings.cheer)return;
 const phrases=['頑張りましょう。','いいペースです。','フォームを意識していきましょう。','あと少しです。'];
 speak(phrases[(state.exerciseIndex+state.setIndex)%phrases.length]);
}
function announceCurrent(){
 const d=state.plan[state.selectedDay],e=d.e[state.exerciseIndex];
 let t=e.n+'。'+e.w+'キロ'+(e.two?'を両手に持って。':'。')+e.voice+'。'+state.setIndex+'セット目。';
 if(state.settings.cheer)t+=' '+['頑張りましょう。','いいペースです。','落ち着いていきましょう。'][(state.exerciseIndex+state.setIndex)%3];
 speak(t);
}
function renderWorkout(){
 const d=state.plan[state.selectedDay],e=d.e[state.exerciseIndex];
 q('#workoutDay').textContent=d.t;q('#exerciseName').textContent=e.n;
 q('#exerciseSpec').textContent=e.w+'kg'+(e.two?' × 2':'')+' ／ '+e.r+' ／ '+state.setIndex+' / '+e.sets+'セット';
 q('#setProgress').innerHTML=Array.from({length:e.sets},(_,i)=>'<div class="dot '+(i<state.setIndex?'on':'')+'"></div>').join('');
 const next=peekNext();
 q('#upNext').textContent=next||'このDAY完了';
}
function peekNext(){
 const d=state.plan[state.selectedDay],e=d.e[state.exerciseIndex];
 if(state.setIndex<e.sets)return e.n+' '+(state.setIndex+1)+'セット目';
 if(state.exerciseIndex<d.e.length-1)return d.e[state.exerciseIndex+1].n+' 1セット目';
 return '';
}
function startWorkout(){
 state.exerciseIndex=0;state.setIndex=1;state.mainSec=900;
 q('#mainTime').textContent='15:00';q('#mainTimeRest').textContent='15:00';
 clearInterval(state.mainTimer);state.mainTimer=setInterval(()=>{state.mainSec=Math.max(0,state.mainSec-1);const t=String(Math.floor(state.mainSec/60)).padStart(2,'0')+':'+String(state.mainSec%60).padStart(2,'0');q('#mainTime').textContent=t;q('#mainTimeRest').textContent=t;if(state.mainSec===0){clearInterval(state.mainTimer);finishWorkout(true)}},1000);
 if(state.settings.bgm)startBgm();
 renderWorkout();show('workout');announceCurrent();
}
function completeSet(){
 const d=state.plan[state.selectedDay],e=d.e[state.exerciseIndex];
 const log=JSON.parse(localStorage.getItem('logs')||'[]');log.push({ts:Date.now(),day:state.selectedDay,exercise:e.n,kg:e.w,reps:e.r,set:state.setIndex});localStorage.setItem('logs',JSON.stringify(log));
 if(state.setIndex<e.sets)state.setIndex++;
 else if(state.exerciseIndex<d.e.length-1){state.exerciseIndex++;state.setIndex=1}
 else {finishWorkout(false);return}
 startRest();
}
function startRest(){
 clearInterval(state.restTimer);state.restSec=60;q('#restTime').textContent='60';q('#restBar').style.width='100%';q('#restNext').textContent='次：'+(peekCurrentLabel());
 show('rest');speak('セット終了。60秒休憩です。');
 state.restTimer=setInterval(()=>{state.restSec--;q('#restTime').textContent=state.restSec;q('#restBar').style.width=(state.restSec/60*100)+'%';if(state.restSec===10)speak('あと10秒です。');if(state.restSec<=0){clearInterval(state.restTimer);resumeAfterRest()}},1000);
}
function peekCurrentLabel(){const d=state.plan[state.selectedDay],e=d.e[state.exerciseIndex];return e.n+' '+state.setIndex+'セット目'}
function resumeAfterRest(){show('workout');renderWorkout();speak('レスト終了。次のセットです。');setTimeout(announceCurrent,1200)}
function finishWorkout(timeup){
 clearInterval(state.mainTimer);clearInterval(state.restTimer);stopBgm();speechSynthesis&&speechSynthesis.cancel();
 state.lastDay=state.selectedDay;localStorage.setItem('lastCompletedDay',String(state.lastDay));
 const next=((state.selectedDay)%5)+1;
 q('#finishText').textContent=(timeup?'15分が終了しました。':'全セット完了です。')+' 次回はDAY'+next+'をおすすめします。';
 show('finish');
 if(state.settings.voice){setTimeout(()=>speak('お疲れさまでした。今日のトレーニングは終了です。'),250)}
}
function startBgm(){if(!state.settings.bgm)return;const a=q('#bgmAudio');a.src=state.settings.track==='118'?'./249_long_BPM118.mp3':'./126_long_BPM142.mp3';a.volume=Math.max(0,Math.min(1,state.settings.volume/100));a.play().catch(()=>{})}function stopBgm(){const a=q('#bgmAudio');a.pause();a.currentTime=0}
q('#openSettings').onclick=()=>show('settings');
qa('[data-back]').forEach(b=>b.onclick=()=>{renderHome();show(b.dataset.back)});
q('#quickStart').onclick=()=>openPrepare(recommendedDay());
q('#beginWorkout').onclick=startWorkout;
q('#setComplete').onclick=completeSet;
q('#skipRest').onclick=()=>{clearInterval(state.restTimer);resumeAfterRest()};
q('#quitWorkout').onclick=()=>{if(confirm('トレーニングを終了しますか？')){clearInterval(state.mainTimer);clearInterval(state.restTimer);stopBgm();renderHome();show('home')}};
q('#finishHome').onclick=()=>{renderHome();show('home')};
q('#voiceToggle').checked=state.settings.voice;q('#cheerToggle').checked=state.settings.cheer;q('#bgmToggle').checked=state.settings.bgm;q('#volume').value=state.settings.volume;q('#bgmTrack').value=state.settings.track;q('#visualToggle').checked=state.settings.visual;q('#visualStyle').value=state.settings.visualStyle;
q('#voiceToggle').onchange=e=>{state.settings.voice=e.target.checked;saveSettings()};
q('#cheerToggle').onchange=e=>{state.settings.cheer=e.target.checked;saveSettings()};
q('#bgmToggle').onchange=e=>{state.settings.bgm=e.target.checked;saveSettings();if(!state.settings.bgm)stopBgm()};
q('#bgmTrack').onchange=e=>{state.settings.track=e.target.value;saveSettings();if(!q('#bgmAudio').paused)startBgm()};
q('#volume').oninput=e=>{state.settings.volume=+e.target.value;saveSettings();q('#bgmAudio').volume=state.settings.volume/100};
q('#visualToggle').onchange=e=>{state.settings.visual=e.target.checked;saveSettings();applyVisuals()};
q('#visualStyle').onchange=e=>{state.settings.visualStyle=e.target.value;saveSettings();applyVisuals()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
renderHome();
</script>
</body>
</html>
